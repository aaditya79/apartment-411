[project]
name = "apartment-411"
version = "1.0.0"
description = "Apartment 411: a tool-calling agent that checks any NYC rental against city records before you sign"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "cachetools>=7.2.1",
    "numpy>=2.2.6",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
]
